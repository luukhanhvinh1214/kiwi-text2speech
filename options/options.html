<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Cài đặt Kiwi Text to Speech</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Cài đặt Kiwi Text to Speech</h1>

      <section>
        <h2>Bộ đọc</h2>
        <label class="chon">
          <input type="radio" name="engine" value="system" />
          <span>
            <b>Giọng hệ thống</b>
            <small>Dùng giọng đọc sẵn có của Chrome và của máy. Không cần cài thêm gì.</small>
          </span>
        </label>
        <label class="chon">
          <input type="radio" name="engine" value="server" />
          <span>
            <b>Máy chủ trên máy</b>
            <small>Gọi một máy chủ chạy trên máy bạn theo giao thức OpenAI speech, ví dụ VieNeu-TTS. Giọng tiếng Việt tự nhiên hơn nhưng phải tự chạy máy chủ.</small>
          </span>
        </label>
      </section>

      <section>
        <h2>Giọng hệ thống</h2>
        <label class="field">
          <span>Ngôn ngữ</span>
          <input type="text" id="lang" placeholder="vi-VN" />
        </label>
        <label class="field">
          <span>Cao độ <output id="pitch-value">1,0</output></span>
          <input type="range" id="pitch" min="0" max="2" step="0.1" />
        </label>
      </section>

      <section>
        <h2>Máy chủ trên máy</h2>
        <label class="field">
          <span>Địa chỉ</span>
          <input type="text" id="base-url" placeholder="http://127.0.0.1:8000" />
        </label>
        <label class="field">
          <span>Tên mô hình</span>
          <input type="text" id="model" placeholder="vieneu-v3-turbo" />
        </label>
        <label class="field">
          <span>Giọng</span>
          <input type="text" id="server-voice" placeholder="Để trống là dùng giọng mặc định của máy chủ" />
        </label>
        <label class="field">
          <span>Tần số lấy mẫu</span>
          <select id="sample-rate">
            <option value="48000">48000</option>
            <option value="24000">24000</option>
            <option value="16000">16000</option>
            <option value="8000">8000</option>
          </select>
        </label>
        <label class="field">
          <span>Khoá truy cập</span>
          <input type="password" id="api-key" autocomplete="off" />
          <small id="api-key-note">Khoá chỉ nằm trên máy này. Để trống nếu máy chủ không yêu cầu.</small>
        </label>
        <button type="button" id="thu-ket-noi">Thử kết nối</button>
      </section>

      <section>
        <h2>Chung</h2>
        <label class="field">
          <span>Âm lượng <output id="volume-value">1,0</output></span>
          <input type="range" id="volume" min="0" max="1" step="0.05" />
        </label>
        <label class="field">
          <span>Số ký tự tối đa mỗi đoạn</span>
          <input type="number" id="max-chars" min="80" max="1000" step="10" />
        </label>
      </section>

      <div class="luu">
        <button type="button" id="luu" class="primary">Lưu</button>
        <p id="status"></p>
      </div>
    </main>

    <script src="options.js" type="module"></script>
  </body>
</html>
