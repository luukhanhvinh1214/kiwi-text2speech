<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Kiwi Text to Speech</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img src="../icons/logo-lkv.png" alt="Chữ ký LKV" />
      <div class="brand-text">
        <div class="name">Lưu Khánh Vinh</div>
        <div class="role">AI &amp; Software Engineer</div>
      </div>
    </header>

    <h1>Kiwi Text to Speech</h1>

    <label class="field">
      <span>Văn bản</span>
      <textarea id="text" rows="6" placeholder="Bôi đen chữ trên trang rồi mở lại, hoặc gõ vào đây"></textarea>
    </label>

    <button type="button" id="lay-doan-da-chon" class="link">Lấy đoạn đang chọn trên trang</button>

    <label class="field">
      <span>Giọng đọc</span>
      <select id="voice"></select>
    </label>
    <p id="goi-y" class="goi-y"></p>

    <label class="field">
      <span>Tốc độ <output id="rate-value">1,0</output></span>
      <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
    </label>

    <div class="buttons">
      <button type="button" id="doc" class="primary" title="Đọc" aria-label="Đọc">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5 13 8l-9 5.5z" /></svg>
      </button>
      <button type="button" id="tam-dung" title="Tạm dừng" aria-label="Tạm dừng">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="4" y="3" width="3" height="10" />
          <rect x="9" y="3" width="3" height="10" />
        </svg>
      </button>
      <button type="button" id="tiep-tuc" title="Tiếp tục" aria-label="Tiếp tục">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3" y="3" width="2.5" height="10" />
          <path d="M7.5 3 13.5 8l-6 5z" />
        </svg>
      </button>
      <button type="button" id="dung" title="Dừng" aria-label="Dừng">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" /></svg>
      </button>
    </div>

    <p id="status" class="status">Đang chờ</p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
