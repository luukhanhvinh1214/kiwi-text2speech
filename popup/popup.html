<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Kiwi Text2Speech</title>
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="head">
      <h1><span class="brand-kiwi">Kiwi</span> Text2Speech</h1>
      <input type="checkbox" role="switch" id="selection-bubble" class="switch" title="Hiện biểu tượng khi bôi đen chữ trên trang" aria-label="Hiện biểu tượng khi bôi đen chữ trên trang" />
    </header>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-tts" class="tab-btn active" aria-selected="true">Đọc</button>
      <button type="button" role="tab" id="tab-translate" class="tab-btn" aria-selected="false">Dịch</button>
    </div>

    <div class="field" id="text-field">
      <div class="field-head">
        <label for="text">Văn bản</label>
        <button type="button" id="expand" class="icon-btn" title="Mở rộng ô văn bản" aria-label="Mở rộng ô văn bản">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M9 2.5h4.5V7" />
            <path d="M13.5 2.5 7.6 8.4" />
            <path d="M13.5 9.5v4h-11v-11h4" />
          </svg>
        </button>
      </div>
      <textarea id="text" rows="5" placeholder="Chọn đoạn văn bản hoặc gõ vào đây."></textarea>
    </div>

    <div id="panel-tts">
      <div id="server-note" class="server-note" hidden>
        <p>Máy chủ giọng nói chưa chạy</p>
        <button type="button" id="copy-run">Sao chép lệnh khởi động</button>
      </div>

      <div class="field">
        <label for="voice">Giọng đọc</label>
        <div class="select-box">
          <select id="voice"></select>
        </div>
      </div>
      <p id="hint" class="hint"></p>

      <label class="field">
        <span>Tốc độ <output id="rate-value">1,0</output></span>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
      </label>

      <div class="buttons">
        <button type="button" id="play" class="primary" title="Đọc" aria-label="Đọc">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5 13 8l-9 5.5z" /></svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <button type="button" id="pause" title="Tạm dừng" aria-label="Tạm dừng">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="4" y="3" width="3" height="10" />
            <rect x="9" y="3" width="3" height="10" />
          </svg>
        </button>
        <button type="button" id="resume" title="Tiếp tục" aria-label="Tiếp tục">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3" y="3" width="2.5" height="10" />
            <path d="M7.5 3 13.5 8l-6 5z" />
          </svg>
        </button>
        <button type="button" id="stop" title="Dừng" aria-label="Dừng">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" /></svg>
        </button>
      </div>
    </div>

    <div id="panel-translate" hidden>
      <div class="lang-row">
        <div class="select-box lang-box">
          <select id="source-lang"></select>
        </div>
        <button type="button" id="swap-lang" class="icon-btn swap-btn" title="Đổi chiều ngôn ngữ" aria-label="Đổi chiều ngôn ngữ">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 5.5h10.5M9.5 2.5l3.5 3-3.5 3" />
            <path d="M13.5 10.5H3M6.5 7.5l-3.5 3 3.5 3" />
          </svg>
        </button>
        <div class="select-box lang-box">
          <select id="target-lang"></select>
        </div>
      </div>

      <div class="translate-action-row">
        <button type="button" id="do-translate" class="primary">Dịch</button>
        <button type="button" id="speak-source" class="icon-btn-action" title="Đọc văn bản nguồn" aria-label="Đọc văn bản nguồn">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M7.5 2.5 3.5 6H1v4h2.5l4 3.5V2.5z" />
            <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5" />
            <path d="M12.5 3.5a6.5 6.5 0 0 1 0 9" />
          </svg>
        </button>
      </div>

      <div class="field" id="result-field">
        <div class="field-head">
          <label for="translated-text">Bản dịch</label>
        </div>
        <textarea id="translated-text" rows="4" readonly placeholder="Kết quả dịch sẽ hiện ở đây."></textarea>
      </div>

      <div class="field">
        <label for="translate-voice">Giọng đọc bản dịch</label>
        <div class="select-box">
          <select id="translate-voice"></select>
        </div>
      </div>

      <div class="translate-buttons">
        <button type="button" id="copy-translation">Sao chép</button>
        <button type="button" id="open-web-translate">Mở trên web</button>
        <button type="button" id="speak-translation" class="icon-btn-action" title="Đọc bản dịch" aria-label="Đọc bản dịch">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M7.5 2.5 3.5 6H1v4h2.5l4 3.5V2.5z" />
            <path d="M10.5 5.5a3.5 3.5 0 0 1 0 5" />
            <path d="M12.5 3.5a6.5 6.5 0 0 1 0 9" />
          </svg>
        </button>
      </div>
    </div>

    <div class="foot">
      <p id="status" class="status">Đang chờ</p>
      <button type="button" id="theme" class="icon-btn theme-btn">
        <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.1" />
          <path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5" />
          <path d="M3.47 3.47 4.53 4.53M11.47 11.47l1.06 1.06M12.53 3.47 11.47 4.53M4.53 11.47l-1.06 1.06" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 9.9A5.8 5.8 0 1 1 6.1 2.5 5.8 5.8 0 0 0 13.5 9.9z" />
        </svg>
      </button>
    </div>

    <footer class="brand">
      <img src="../icons/logo-lkv.png" alt="Chữ ký LKV" />
      <div class="brand-text">
        <div class="name">2imKisSa</div>
        <div class="role">AI &amp; Software Engineer</div>
      </div>
    </footer>

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Ô văn bản mở rộng" hidden>
      <div class="overlay-box" id="text-slot">
        <button type="button" id="close-expand" class="icon-btn close-btn" title="Đóng" aria-label="Đóng">X</button>
        <button type="button" id="shrink" class="icon-btn shrink-btn" title="Thu nhỏ ô văn bản" aria-label="Thu nhỏ ô văn bản">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M12.1 8.4H7.6V3.9" />
            <path d="M7.6 8.4 13.5 2.5" />
            <path d="M13.5 9.5v4h-11v-11h4" />
          </svg>
        </button>
      </div>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
